name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quiz/tests/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:schema

  validate-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node quiz/scripts/validate-all.js
