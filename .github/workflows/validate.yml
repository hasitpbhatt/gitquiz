name: Validate

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 0 * * *'

jobs:
  schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quiz/tests/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:schema

  validate-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node quiz/scripts/validate-all.js

  full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz/tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quiz/tests/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Check for non-courses changes
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD -- ':!courses/' ':!*.md' | wc -l)
            echo "run=$([ "$CHANGED" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: npm test
